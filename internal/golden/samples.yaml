# Sample ground truth for the 4 sample files in samples/
# Usage: make eval-both golden=golden/samples.yaml
queries:
  - query: "secant formula"
    expected_files:
      - "numerical-methods.md"
    relevance:
      "numerical-methods.md": 3
      "trig-functions.md": 1
    expected_answer: "The secant formula is x_{n+1} = x_n - f(x_n) * (x_n - x_{n-1}) / (f(x_n) - f(x_{n-1})). The secant method is a root-finding algorithm that uses a succession of roots of secant lines to approximate a root of a function. In trigonometry, secant (sec) is the reciprocal of cosine: sec(θ) = 1 / cos(θ)."

  - query: "derivative of sin and cos"
    expected_files:
      - "calculus.md"
    relevance:
      "calculus.md": 3
      "trig-functions.md": 1
    expected_answer: "The derivative of sin(x) is cos(x). The derivative of cos(x) is -sin(x)."

  - query: "cosecant identity"
    expected_files:
      - "trig-functions.md"
    relevance:
      "trig-functions.md": 3
    expected_answer: "The cosecant (csc) is the reciprocal of sine: csc(θ) = 1 / sin(θ) = hypotenuse / opposite. A related Pythagorean identity is 1 + cot²(θ) = csc²(θ)."

  - query: "Newton Raphson method"
    expected_files:
      - "numerical-methods.md"
    relevance:
      "numerical-methods.md": 3
    expected_answer: "The Newton-Raphson method formula is x_{n+1} = x_n - f(x_n) / f'(x_n). It has quadratic convergence near the root but requires derivative computation and may diverge if the initial guess is poor."

  - query: "dot product and matrix multiplication"
    expected_files:
      - "linear-algebra.md"
    relevance:
      "linear-algebra.md": 3
    expected_answer: "The dot product of two vectors is u · v = Σ uᵢ · vᵢ. Matrix multiplication: if A is m×n and B is n×p, then C = AB is m×p where C_{ij} = Σ_{k=1}^{n} A_{ik} · B_{kj}."

  - query: "power rule integration"
    expected_files:
      - "calculus.md"
    relevance:
      "calculus.md": 3
    expected_answer: "∫ x^n dx = x^(n+1)/(n+1) + C, for n ≠ -1. When n = -1, ∫ 1/x dx = ln|x| + C."

  - query: "eigenvalue decomposition"
    expected_files:
      - "linear-algebra.md"
    relevance:
      "linear-algebra.md": 3
    expected_answer: "A vector v ≠ 0 is an eigenvector of matrix A if A · v = λ · v, where λ is the corresponding eigenvalue. Eigenvalues are found by solving det(A - λI) = 0 (the characteristic polynomial). Applications include PCA, PageRank, and quantum mechanics."

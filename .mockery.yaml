# Mockery is the single generator for reusable public interface test doubles.
# Private dependency seams stay beside their consuming Module when a focused
# stub is clearer than exporting a test-only contract.
with-expecter: true
resolve-type-alias: false
disable-version-string: true
issue-845-fix: true
dir: "internal/testmocks"
outpkg: mocks
filename: "mock_{{.InterfaceName | snakecase}}.go"
mockname: "Mock{{.InterfaceName}}"
packages:
  nadir/internal/core/conversation/chat:
    interfaces:
      Chat: {}
  nadir/internal/core/conversation/history:
    interfaces:
      Reader: {}
  nadir/internal/core/retrieval/search:
    interfaces:
      Retriever: {}

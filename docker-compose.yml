services:
  app:
    build: .
    ports:
      - "8100:8100"
    environment:
      - QDRANT_ADDR=qdrant:6334
      - OLLAMA_ADDR=http://host.docker.internal:11434
      - RERANKER_ADDR=http://reranker:5002
      - LOGGER_LEVEL=prod
      - QDRANT_COLLECTION=documents_chunks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # The daemon default (1024) gets exhausted by segment files once
    # collections grow — Qdrant then refuses every connection.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  reranker:
    # GPU-first: the build bakes the CUDA-torch image and the container
    # reserves the host GPU (NVIDIA container toolkit required). Both int8
    # routes are CPU artifacts, so cuda serves fp32 torch (ADR 0008).
    # CPU: RERANKER_DEVICE=cpu runs on the same image with no rebuild;
    # RERANKER_GPU=0 only switches the build to the CPU-torch image (for
    # image size, or hosts without the toolkit — those must also delete the
    # reservations block below, or `up` fails on the nvidia driver).
    build:
      context: services/reranker
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
        GPU: ${RERANKER_GPU:-1}
    environment:
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-cuda}
    ports:
      - "5002:5002"
    volumes:
      - reranker_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  qdrant_data:
  reranker_model_cache:

# Podman Compose stack. Run with:
#   podman compose -f deploy/compose/compose.yaml up -d --build
#
# Rootless by default: podman injects the `host.containers.internal` DNS name
# so services can reach Ollama and Docling running on the host.
services:
  app:
    build:
      context: ../..
      dockerfile: Containerfile
    ports:
      - "${NADIR_PORT:-8100}:8100"
    environment:
      QDRANT_ADDR: ${HOST_QDRANT_ADDR:-qdrant:6334}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents_chunks}
      OLLAMA_ADDR: ${HOST_OLLAMA_ADDR:-http://host.containers.internal:11434}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-nomic-embed-text}
      EMBEDDER_DIMENSIONS: ${EMBEDDER_DIMENSIONS:-768}
      EMBEDDER_QUERY_PREFIX: "${EMBEDDER_QUERY_PREFIX:-search_query: }"
      EMBEDDER_DOCUMENT_PREFIX: "${EMBEDDER_DOCUMENT_PREFIX:-search_document: }"
      GENERATOR_ADDR: ${HOST_OLLAMA_ADDR:-http://host.containers.internal:11434}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-gemma3:1b}
      REWRITE_ADDR: ${HOST_OLLAMA_ADDR:-http://host.containers.internal:11434}
      REWRITE_MODEL: ${REWRITE_MODEL:-gemma3:1b}
      CONTEXTUAL_ADDR: ${HOST_OLLAMA_ADDR:-http://host.containers.internal:11434}
      CONTEXTUAL_MODEL: ${CONTEXTUAL_MODEL:-gemma3:1b}
      INFERENCE_PROFILE: ${INFERENCE_PROFILE:-local}
      INFERENCE_OLLAMA_KEEP_ALIVE: ${INFERENCE_OLLAMA_KEEP_ALIVE:-5m}
      RERANKER_ADDR: ${HOST_RERANKER_ADDR:-http://reranker:5002}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_ADAPTIVE_ENABLED: ${RERANKER_ADAPTIVE_ENABLED:-false}
      RERANKER_ADAPTIVE_MARGIN_THRESHOLD: ${RERANKER_ADAPTIVE_MARGIN_THRESHOLD:-0.01}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-prod}
      RERANKER_MAX_CONCURRENT: ${RERANKER_MAX_CONCURRENT:-1}
      RERANKER_QUEUE_TIMEOUT: ${RERANKER_QUEUE_TIMEOUT:-30s}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-torch}
      DOCUMENTS_PATHS: ${HOST_DOCUMENTS_PATHS:-/app/source}
      DOCUMENTS_IGNORE_PATTERNS: ${DOCUMENTS_IGNORE_PATTERNS:-}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-false}
      DOCLING_ADDR: ${HOST_DOCLING_ADDR:-http://host.containers.internal:5003}
    volumes:
      - ${DOCUMENTS_DIR:-../../samples}:/app/source:ro
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8100/api/v1/ready"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # Rootless podman inherits the user session nofile ceiling; if the hard
    # limit below is rejected, raise the user's limit instead of lowering
    # this — Qdrant exhausts 1024 descriptors once collections grow and then
    # refuses every connection.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  reranker:
    # Portable default: CPU image, no GPU device. Linux GPU users layer
    # compose.gpu.yaml (CDI) on top of this file.
    build:
      context: ../../sidecars/reranker
      dockerfile: Containerfile
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
        GPU: ${RERANKER_GPU:-0}
        BAKE_QUANTIZED: ${RERANKER_BAKE_QUANTIZED:-0}
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-torch}
      RERANKER_TRUST_REMOTE_CODE: ${RERANKER_TRUST_REMOTE_CODE:-false}
      RERANKER_MAX_CONCURRENT: ${RERANKER_MAX_CONCURRENT:-1}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
    ports:
      - "${RERANKER_PORT:-5002}:5002"
    volumes:
      - reranker_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${RERANKER_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  docling:
    # Optional PDF document-intake Adapter. Start with:
    # podman compose -f deploy/compose/compose.yaml --profile pdf up -d --build
    profiles: ["pdf"]
    build:
      context: ../../sidecars/document-converter
      dockerfile: Containerfile
    ports:
      - "${DOCLING_PORT:-5003}:5003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  qdrant_data:
  reranker_model_cache:

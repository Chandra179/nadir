services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${NADIR_PORT:-8100}:8100"
    environment:
      QDRANT_ADDR: ${DOCKER_QDRANT_ADDR:-qdrant:6334}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents_chunks}
      OLLAMA_ADDR: ${DOCKER_OLLAMA_ADDR:-http://host.docker.internal:11434}
      GENERATOR_ADDR: ${DOCKER_OLLAMA_ADDR:-http://host.docker.internal:11434}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-gemma3:1b}
      REWRITE_ADDR: ${DOCKER_OLLAMA_ADDR:-http://host.docker.internal:11434}
      REWRITE_MODEL: ${REWRITE_MODEL:-gemma3:1b}
      HYPE_ADDR: ${DOCKER_OLLAMA_ADDR:-http://host.docker.internal:11434}
      HYPE_MODEL: ${HYPE_MODEL:-gemma3:1b}
      CONTEXTUAL_ADDR: ${DOCKER_OLLAMA_ADDR:-http://host.docker.internal:11434}
      CONTEXTUAL_MODEL: ${CONTEXTUAL_MODEL:-gemma3:1b}
      RERANKER_ADDR: ${DOCKER_RERANKER_ADDR:-http://reranker:5002}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-prod}
      SOURCE_PATHS: ${DOCKER_SOURCE_PATHS:-/app/source}
      SOURCE_IGNORE_PATTERNS: ${SOURCE_IGNORE_PATTERNS:-}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-false}
      DOCLING_ADDR: ${DOCKER_DOCLING_ADDR:-http://host.docker.internal:5003}
    volumes:
      - ${SOURCE_DIR:-../../samples}:/app/source:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8100/api/v1/ready"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # The daemon default (1024) gets exhausted by segment files once
    # collections grow — Qdrant then refuses every connection.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  reranker:
    # Portable default: CPU image, no NVIDIA reservation. Linux GPU users
    # should layer docker-compose.gpu.yml on top of this file.
    build:
      context: ../../sidecars/reranker
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
        GPU: ${RERANKER_GPU:-0}
        BAKE_QUANTIZED: ${RERANKER_BAKE_QUANTIZED:-0}
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-torch}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
    ports:
      - "${RERANKER_PORT:-5002}:5002"
    volumes:
      - reranker_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${RERANKER_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  docling:
    # Optional PDF document-intake Adapter. Start with:
    # docker compose -f deploy/compose/docker-compose.yml --profile pdf up -d --build
    profiles: ["pdf"]
    build:
      context: ../../sidecars/document-converter
    ports:
      - "${DOCLING_PORT:-5003}:5003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  qdrant_data:
  reranker_model_cache:

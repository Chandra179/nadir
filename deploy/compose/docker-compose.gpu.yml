services:
  reranker:
    build:
      context: ../../services/reranker
      args:
        GPU: ${RERANKER_GPU:-1}
        BAKE_QUANTIZED: ${RERANKER_BAKE_QUANTIZED:-0}
    environment:
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cuda}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-torch}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

services:
  app:
    environment:
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cuda}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-torch}
  reranker:
    build:
      context: ../../sidecars/reranker
      args:
        GPU: ${RERANKER_GPU:-1}
        BAKE_QUANTIZED: ${RERANKER_BAKE_QUANTIZED:-0}
    environment:
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cuda}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-torch}
      RERANKER_MAX_CONCURRENT: ${RERANKER_MAX_CONCURRENT:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

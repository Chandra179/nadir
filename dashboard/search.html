{{define "page"}}
<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<script>
  // Streaming answers: the turn fragment arrives with an empty answer
  // paragraph plus a data-stream-url; a plain EventSource appends token
  // text there (textContent keeps raw server text inert, so the SSE payload
  // needs no escaping). Terminal events close the source, stop the cursor,
  // restore the composer button and refresh the sidebar — persistence
  // happens when the stream ends, not when the POST responds.
  var nadirActiveStream = null;
  var nadirBusyCount = 0;

  function nadirScrollReader() {
    var rd = document.getElementById('reader');
    if (rd) rd.scrollTop = rd.scrollHeight;
  }

  // The send button doubles as the stop button while anything is in flight
  // (retrieval or generation): the square icon shows and clicking it
  // cancels instead of submitting.
  function nadirBusyAdd(n) {
    nadirBusyCount = Math.max(0, nadirBusyCount + n);
    var send = document.getElementById('composer-send-icon');
    var stop = document.getElementById('composer-stop-icon');
    if (send) send.classList.toggle('hidden', nadirBusyCount > 0);
    if (stop) stop.classList.toggle('hidden', nadirBusyCount === 0);
  }

  // Stop aborts the newest in-flight generation. The server keeps the
  // answer generated so far, publishes the terminal event, and persists the
  // partial turn; this stream's own handler does the cleanup.
  function nadirStop() {
    var elt = nadirActiveStream;
    if (!elt || !elt.dataset.turnId) return;
    fetch('/retrieval/turns/' + encodeURIComponent(elt.dataset.turnId) + '/cancel', { method: 'POST' })
      .catch(function(err) { console.error(err); });
  }

  function nadirEndStream(elt, es) {
    if (!elt.dataset.streaming) return;
    delete elt.dataset.streaming;
    elt.classList.remove('nadir-streaming');
    es.close();
    nadirBusyAdd(-1);
    if (nadirActiveStream === elt) nadirActiveStream = null;
    htmx.trigger(document.body, 'nadir:turn-appended');
    nadirScrollReader();
  }

  function nadirStartStream(elt) {
    if (elt.dataset.streaming) return;
    elt.dataset.streaming = '1';
    nadirActiveStream = elt;
    nadirBusyAdd(1);
    var answer = elt.querySelector('.nadir-answer');
    var errSlot = elt.querySelector('.nadir-generror');
    var es = new EventSource(elt.dataset.streamUrl);
    es.addEventListener('token', function(e) {
      answer.insertAdjacentText('beforeend', e.data);
      nadirScrollReader();
    });
    // Both domain terminal states end the stream: generror is published as
    // the last event before the log closes, never followed by done.
    es.addEventListener('generror', function(e) {
      errSlot.textContent = e.data;
      nadirEndStream(elt, es);
    });
    es.addEventListener('done', function() { nadirEndStream(elt, es); });
    // Safety net for a fatal transport error (e.g. the turn's log was
    // evicted): keep whatever text arrived and restore the button.
    es.onerror = function() {
      if (es.readyState === EventSource.CLOSED) nadirEndStream(elt, es);
    };
  }

  // Turn fragments land in the reader via the composer form's swap; each
  // one carrying a stream URL starts its EventSource here.
  document.addEventListener('htmx:afterSwap', function(e) {
    var target = e.detail && e.detail.target;
    if (!target || target.id !== 'reader-inner') return;
    target.querySelectorAll('.nadir-streaming[data-stream-url]').forEach(nadirStartStream);
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest || !e.target.closest('#composer-send')) return;
    if (nadirBusyCount > 0) {
      e.preventDefault();
      nadirStop();
    }
  });

  var NADIR_DOC_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8"/><path d="M14 2v6h6M8 13h8M8 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  function nadirAttachedNames() {
    return Array.from(document.querySelectorAll('#composer-attachments [data-chip]'))
      .map(function(el) { return el.dataset.filename; })
      .filter(Boolean);
  }

  function nadirFileCardsRow(names) {
    var row = document.createElement('div');
    row.className = 'flex justify-end flex-wrap gap-2 mb-2';
    names.forEach(function(name) {
      var card = document.createElement('div');
      card.className = 'w-[118px] bg-[#eeece3] border border-[#e3e2d8] rounded-[12px] px-2.5 py-2.5 flex flex-col items-start gap-2';
      var icon = document.createElement('div');
      icon.className = 'w-7 h-7 rounded-[7px] bg-[#dce8fb] text-[#2f5db0] flex items-center justify-center';
      icon.innerHTML = NADIR_DOC_ICON;
      var label = document.createElement('div');
      label.className = 'text-[12px] text-[#5c6156] truncate w-full';
      label.textContent = name;
      card.appendChild(icon);
      card.appendChild(label);
      row.appendChild(card);
    });
    return row;
  }

  // htmx:configRequest fires before the request's parameters are locked in,
  // so this is the one hook where we can still add a field — the file
  // picker (POST /ingest) and the search form (POST /retrieval/search) are
  // independent requests, so the currently-attached names have to be
  // threaded through explicitly rather than riding along automatically.
  function nadirConfigRequest(evt) {
    var names = nadirAttachedNames();
    if (names.length) evt.detail.parameters['attached_files'] = names.join(',');
  }

  // The POST returns once retrieval is done (the answer then streams over
  // SSE from /retrieval/answer/:id). This appends an optimistic placeholder
  // turn (question + attached files + a pulsing "retrieving" row) the instant
  // the request goes out, then removes it once the real turn fragment has
  // been swapped in.
  function nadirBeforeSearch(form) {
    document.getElementById('empty-state')?.remove();
    var input = form.querySelector('#composer-input');
    var query = input ? input.value.trim() : '';
    if (!query) return;

    nadirBusyAdd(1);
    var attachedNames = nadirAttachedNames();

    // Attachment chips only confirm an import already finished — the file
    // isn't scoped to this message, so clear them once the message is sent
    // (their names were already captured above, and by configRequest).
    var attachments = document.getElementById('composer-attachments');
    if (attachments) attachments.innerHTML = '';

    // htmx has already snapshotted the form's parameters by the time this
    // fires, so clearing the textarea here doesn't affect what gets sent —
    // it just makes the composer feel instant instead of waiting on the
    // (buffered, potentially slow) response before clearing.
    input.value = '';
    input.style.height = 'auto';

    var ri = document.getElementById('reader-inner');
    var wrap = document.createElement('div');
    wrap.id = 'pending-turn';
    wrap.className = 'mb-8';

    if (attachedNames.length) wrap.appendChild(nadirFileCardsRow(attachedNames));

    var userRow = document.createElement('div');
    userRow.className = 'flex justify-end mb-3.5';
    var bubble = document.createElement('div');
    bubble.className = 'text-[16px] leading-[1.5] bg-[#2f5d5017] border border-[#2f5d5017] rounded-tl-[14px] rounded-tr-[14px] rounded-bl-[14px] rounded-br-[3px] px-[15px] py-[10px] max-w-[82%]';
    bubble.textContent = query;
    userRow.appendChild(bubble);

    var trace = document.createElement('div');
    trace.className = 'flex gap-2.5 py-1.5';
    var traceIcon = document.createElement('span');
    traceIcon.className = 'w-4 text-center text-[#8b8f81] flex-none animate-pulse';
    traceIcon.textContent = '⊕';
    var traceBody = document.createElement('div');
    traceBody.className = 'flex-1 min-w-0 text-[14px]';
    traceBody.innerHTML = '<span class="font-semibold text-[#5c6156]">Tool</span><span class="text-[#8b8f81]"> · </span><span class="text-[#8b8f81] animate-pulse">Retrieving relevant passages…</span>';
    trace.appendChild(traceIcon);
    trace.appendChild(traceBody);

    wrap.appendChild(userRow);
    wrap.appendChild(trace);
    ri.appendChild(wrap);

    var rd = document.getElementById('reader');
    if (rd) rd.scrollTop = rd.scrollHeight;
  }

  function nadirAfterSearch(form, evt) {
    document.getElementById('pending-turn')?.remove();
    form.reset();
    var ta = document.getElementById('composer-input');
    if (ta) ta.style.height = 'auto';

    // Release the retrieval-phase busy count. A response that started a
    // stream has already re-claimed the button via nadirStartStream, so
    // this decrement never drops it below the live stream's count.
    nadirBusyAdd(-1);

    // The server mints a session id on the first turn (never client-side,
    // so a client can't spoof/collide another session's id) and hands it
    // back via this header; form.reset() above reverts the hidden field to
    // its original rendered value, so it has to be re-applied after.
    var sid = evt && evt.detail && evt.detail.xhr ? evt.detail.xhr.getResponseHeader('X-Nadir-Session-Id') : null;
    if (sid) {
      var sidInput = document.getElementById('composer-session-id');
      if (sidInput) sidInput.value = sid;
    }

    var rd = document.getElementById('reader');
    if (rd) rd.scrollTop = rd.scrollHeight;
  }

  // Sidebar delete: removes the session server-side, then refreshes the
  // chat list via the same event a new turn fires. If the deleted chat is
  // the one currently open, bail to /retrieval instead of showing a dead
  // session page.
  function nadirDeleteSession(id) {
    fetch('/history/sessions/' + encodeURIComponent(id), { method: 'DELETE' })
      .then(function(res) {
        if (!res.ok) throw new Error('delete failed with status ' + res.status);
        if (window.location.pathname === '/history/sessions/' + id) {
          window.location.href = '/retrieval';
          return;
        }
        htmx.trigger(document.body, 'nadir:turn-appended');
      })
      .catch(function(err) { console.error(err); });
  }
</script>
<style>
  body{ font-family:'Public Sans', ui-sans-serif, system-ui, sans-serif; background:#f7f7f4; color:#20241f; }
  .font-serif-display{ font-family:'Source Serif 4', Georgia, serif; }
  .font-mono-ui{ font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }
  .feedback{ font-size:11px; }
  .feedback-ok{ color:#234840; }
  .feedback-err{ color:#b04a3f; }
  [x-cloak]{ display:none !important; }
  .nadir-streaming .nadir-answer::after{ content:"▍"; margin-left:1px; color:#8b8f81; animation:nadir-blink 1s steps(2,start) infinite; }
  @keyframes nadir-blink{ to{ visibility:hidden; } }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#e4e1d5; border-radius:6px; border:2px solid #f7f7f4; }
</style>
</head>
<body class="h-full overflow-hidden">
  <div class="flex h-screen relative" x-data="{ sidebarOpen: false, deleteSession: null }">
    <div x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"
         class="fixed inset-0 bg-black/30 z-30 md:hidden"></div>

    <div x-show="deleteSession" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4"
         @keydown.escape.window="deleteSession = null">
      <div @click.outside="deleteSession = null"
           class="bg-[#f7f7f4] border border-[#dcd8c9] rounded-[16px] shadow-xl w-full max-w-[340px] p-6 text-center">
        <div class="font-serif-display font-semibold text-[16px] mb-1">Delete chat?</div>
        <p class="text-[13px] text-[#8b8f81] mb-5 truncate" x-text="deleteSession?.title"></p>
        <div class="flex justify-center gap-2">
          <button type="button" @click="deleteSession = null"
            class="text-[13.5px] text-[#5c6156] border border-[#dcd8c9] rounded-lg px-3.5 py-2 hover:bg-[#eeece3] transition">Cancel</button>
          <button type="button" @click="nadirDeleteSession(deleteSession.id); deleteSession = null"
            class="text-[13.5px] text-white bg-[#b04a3f] rounded-lg px-3.5 py-2 flex items-center gap-2 hover:bg-[#a03e34] transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 4h4M6 7l1 13a1 1 0 0 0 1 .93h8A1 1 0 0 0 17 20l1-13M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Delete
          </button>
        </div>
      </div>
    </div>

    <div class="fixed inset-y-0 left-0 z-40 w-[264px] max-w-[82vw] transform transition-transform duration-200 ease-out md:static md:translate-x-0 md:flex-none"
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
      {{template "sidebar" .}}
    </div>

    <main class="flex flex-col min-w-0 min-h-0 flex-1"
          x-data="{ ask(text){ this.$refs.composerInput.value = text; htmx.trigger(this.$refs.composerForm, 'submit'); } }">
      <div class="flex items-center gap-2.5 border-b border-[#e3e2d8] px-4 md:px-7 py-3 flex-none">
        <button type="button" @click="sidebarOpen = !sidebarOpen" aria-label="Toggle chats"
          class="md:hidden w-8 h-8 -ml-1 rounded-lg flex items-center justify-center text-[#5c6156] hover:bg-[#eeece3]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="font-serif-display font-semibold text-[17px]">New chat</div>
      </div>

      <div id="reader" class="flex-1 overflow-y-auto overflow-x-hidden">
        <div id="reader-inner" class="mx-auto max-w-[768px] px-4 md:px-7 pt-8 pb-4">
          {{if .Turns}}
          {{range .Turns}}{{template "turn" .}}{{end}}
          {{else}}
          <div id="empty-state" class="pt-16 text-center">
            <div class="font-serif-display text-[24px] font-semibold mb-2">Ask your documents</div>
            <p class="text-[14.5px] text-[#8b8f81] mb-6">Retrieval runs through Qdrant hybrid search before every generated answer.</p>
            <div class="flex flex-wrap justify-center gap-2">
              <button type="button" @click="ask($el.dataset.q)" class="text-[14px] text-[#5c6156] border border-[#dcd8c9] rounded-lg px-3.5 py-2 hover:border-[#2f5d50] hover:text-[#234840] transition" data-q="What's the secant formula, and when do I use it instead of tangent?">What's the secant formula, and when do I use it instead of tangent?</button>
              <button type="button" @click="ask($el.dataset.q)" class="text-[14px] text-[#5c6156] border border-[#dcd8c9] rounded-lg px-3.5 py-2 hover:border-[#2f5d50] hover:text-[#234840] transition" data-q="How does chunk overlap affect retrieval quality?">How does chunk overlap affect retrieval quality?</button>
            </div>
          </div>
          {{end}}
        </div>
      </div>

      {{template "composer" .}}
    </main>
  </div>
</body>
</html>
{{end}}

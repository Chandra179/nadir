<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadir · Retrieval</title>
<script>
  (function () {
    try {
      var stored = localStorage.getItem('nadir-theme');
      if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>

<style>
  /* Same Workbench shell as dashboard/index.html — same tokens and
     component classes, so the two pages read as one product. See that
     file for the responsive-collapse rationale. */
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --field: #eef0f3; --border: #e3e5ea;
    --text: #1d2027; --text-dim: #565b6c; --text-faint: #767c90;
    --accent: #b8631f; --accent-soft: #f7e9da; --accent-ink: #8f4c17;
    --success: #2f9e6a; --danger: #c94a3f; --danger-soft: #fbe9e7;
    --r-sm: 8px; --r-md: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --surface: #1b1e27; --field: #22252f; --border: #2a2e3a;
      --text: #e8e9ee; --text-dim: #a7acbe; --text-faint: #7d8399;
      --accent: #e0964a; --accent-soft: #362619; --accent-ink: #f2c087;
      --success: #4fbf8f; --danger: #e0776c; --danger-soft: #331d1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --surface: #1b1e27; --field: #22252f; --border: #2a2e3a;
    --text: #e8e9ee; --text-dim: #a7acbe; --text-faint: #7d8399;
    --accent: #e0964a; --accent-soft: #362619; --accent-ink: #f2c087;
    --success: #4fbf8f; --danger: #e0776c; --danger-soft: #331d1b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: "Source Serif 4", Georgia, serif; margin: 0; text-wrap: balance; }
  .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button { font-family: inherit; }
  a { text-decoration: none; }

  .htmx-indicator { opacity: 0; transition: opacity .1s ease; }
  .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
  .spin-icon { display: inline-block; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin-icon { animation: none; } }

  .shell { display: grid; grid-template-columns: 216px 380px 1fr; height: 100vh; height: 100dvh; }

  .rail { background: var(--surface); border-right: 1px solid var(--border); padding: 22px 16px; display: flex; flex-direction: column; overflow-y: auto; }
  .mark { display: flex; align-items: center; gap: 9px; padding: 0 6px; margin-bottom: 26px; }
  .mark .glyph { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-family: "Source Serif 4", serif; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .mark .name { font-family: "Source Serif 4", serif; font-size: 15px; font-weight: 600; }

  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 20px; }
  .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text-dim); }
  .sidebar-nav a svg { width: 16px; height: 16px; opacity: .75; flex-shrink: 0; }
  .sidebar-nav a:hover { color: var(--text); }
  .sidebar-nav a.active { background: var(--accent-soft); color: var(--accent-ink); }
  .sidebar-nav a.active svg { opacity: 1; }

  .rail-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-status { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-faint); }
  .rail-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .rail-theme { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; color: var(--text-faint); background: none; border: none; cursor: pointer; flex-shrink: 0; }
  .rail-theme:hover { color: var(--accent); background: var(--field); }
  .rail-theme svg { width: 14px; height: 14px; }
  .rail-theme .sun { display: none; }
  :root[data-theme="dark"] .rail-theme .sun, :root:not([data-theme="light"]) .rail-theme .sun { display: block; }
  :root[data-theme="dark"] .rail-theme .moon, :root:not([data-theme="light"]) .rail-theme .moon { display: none; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) .rail-theme .sun { display: none; }
    :root:not([data-theme]) .rail-theme .moon { display: block; }
  }

  .control { background: var(--bg); border-right: 1px solid var(--border); padding: 26px 24px; overflow-y: auto; }
  .c-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; color: var(--text-faint); margin-bottom: 6px; }
  .control h1 { font-size: 21px; font-weight: 600; margin-bottom: 24px; }
  .block { margin-bottom: 24px; }
  .block h2 { font-size: 13.5px; font-weight: 600; margin-bottom: 12px; }

  .tabs { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 12px; width: 100%; }
  .tabs button { flex: 1; border: none; background: transparent; font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 7px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .tabs button.active { background: var(--accent-soft); color: var(--accent-ink); }

  .field-line { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 10px 13px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 9px; }
  .field-line:focus-within { border-color: var(--accent); }
  .field-line input, .field-line textarea { border: none; background: none; outline: none; font-family: "Roboto Mono", monospace; font-size: 13px; color: var(--text); width: 100%; resize: vertical; }
  .field-line textarea { min-height: 44px; line-height: 1.5; }
  .field-line svg { color: var(--text-faint); flex-shrink: 0; margin-top: 2px; }

  .opt-line { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .opt-line input[type="number"] { width: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; text-align: center; font-family: "Roboto Mono", monospace; color: var(--text); }
  .switch { position: relative; width: 32px; height: 19px; flex-shrink: 0; display: inline-block; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; transition: background .15s ease; pointer-events: none; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--text-faint); transition: transform .15s ease, background .15s ease; pointer-events: none; }
  .switch input:checked + .track { background: var(--accent-soft); border-color: var(--accent); }
  .switch input:checked + .track + .thumb { transform: translateX(13px); background: var(--accent); }

  .adv-toggle { font-size: 11.5px; color: var(--text-faint); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; background: none; border: none; font-family: inherit; padding: 0 0 12px; }
  .adv-toggle:hover { color: var(--accent); }
  .adv-panel { display: none; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .adv-panel.open { display: flex; }
  .adv-panel .field-line { margin-bottom: 0; padding: 8px 10px; }
  .adv-panel input { font-size: 12px; }

  .chip { font-family: "Roboto Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); padding: 4px 9px; border-radius: 100px; cursor: pointer; }

  .btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; padding: 11px 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { background: var(--accent-ink); }

  /* ---------- console pane: same inverted terminal treatment as the
     ingestion page's console, now holding search results instead of a
     log ---------- */
  .console { background: var(--text); color: var(--bg); padding: 26px 32px; overflow-y: auto; }
  :root[data-theme="dark"] .console, :root:not([data-theme="light"]) .console { background: #0c0d11; color: #c3c7d1; }
  @media (prefers-color-scheme: light) { :root:not([data-theme]) .console { background: var(--text); color: var(--bg); } }

  .console h2 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 3px; }

  .path-crumb { font-family: "Roboto Mono", monospace; font-size: 11px; color: rgba(255,255,255,.4); }
  .path-crumb b { color: rgba(255,255,255,.8); font-weight: 500; }

  .score-bar { position: relative; width: 56px; height: 4px; border-radius: 100px; background: rgba(255,255,255,.12); overflow: hidden; }
  .score-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 100px; }
  .score-val { font-family: "Roboto Mono", monospace; font-size: 11px; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }

  .result-card { padding: 15px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .result-card:first-child { border-top: none; }
  .result-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .result-score { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .result-snippet { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.7); white-space: pre-wrap; }

  .answer-panel { background: rgba(224,150,74,.12); border: 1px solid rgba(224,150,74,.3); border-radius: 10px; padding: 15px 17px; margin-bottom: 22px; }
  .answer-panel .a-label { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 8px; }
  .answer-panel .a-text { font-size: 13.5px; line-height: 1.65; color: #f2ded0; white-space: pre-wrap; }

  .empty-hint, .error-hint { padding: 8px 0; font-size: 12.5px; color: rgba(255,255,255,.4); }
  .error-hint { color: var(--danger); }

  @media (max-width: 999px) {
    .shell { display: block; height: auto; }
    .rail { flex-direction: row; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; }
    .mark { margin-bottom: 0; }
    .sidebar-nav { flex-direction: row; margin: 0 0 0 auto; gap: 4px; }
    .rail-foot { margin-top: 0; padding-top: 0; border-top: none; margin-left: 10px; }
    .rail-status span:not(.dot) { display: none; }

    .control, .console { border-right: none; overflow-y: visible; }
    .control { padding: 24px 20px; }
    .console { padding: 24px 20px; }
  }
  @media (max-width: 560px) {
    .control, .console { padding: 20px 16px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="mark"><span class="glyph">N</span><span class="name">Nadir</span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Ingestion
        </a>
        <a href="/retrieval" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
          Retrieval
        </a>
      </nav>

      <div class="rail-foot">
        <span class="rail-status"><span class="dot"></span>Connected</span>
        <button class="rail-theme" id="theme-toggle" type="button" aria-label="Toggle color theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
        </button>
      </div>
    </aside>

    <main class="control">
      <div class="c-eyebrow">Nadir · Search Engine</div>
      <h1>Retrieval</h1>

      <form hx-post="/retrieval/search" hx-target="#results" hx-swap="innerHTML" hx-indicator="#search-spinner">
        <div class="block">
          <h2>Query</h2>
          <div class="tabs" id="mode-toggle" role="tablist">
            <button type="button" class="active" data-mode="semantic">Semantic</button>
            <button type="button" data-mode="keyword">Keyword</button>
          </div>
          <input type="hidden" id="mode-input" name="mode" value="semantic">

          <div class="field-line">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <textarea id="query-input" name="query" rows="2" placeholder="ask a question in plain language" autocomplete="off"></textarea>
          </div>

          <div class="opt-line">
            <label for="top-k-input">top_k</label>
            <input id="top-k-input" name="top_k" type="number" value="{{.DefaultTopK}}" min="1" max="50">
          </div>
          <div class="opt-line">
            <label for="generate-input">Generate answer</label>
            <span class="switch">
              <input id="generate-input" name="generate" type="checkbox">
              <span class="track"></span>
              <span class="thumb"></span>
            </span>
          </div>

          <button type="button" class="adv-toggle" id="adv-toggle">
            Filters
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div class="adv-panel" id="adv-panel">
            <div class="field-line"><input type="text" name="file_path" placeholder="file_path"></div>
            <div class="field-line"><input type="text" name="header" placeholder="header"></div>
            <div class="field-line"><input type="text" name="source_sha" placeholder="source_sha"></div>
          </div>

          <button type="submit" class="btn">
            <span id="search-spinner" class="htmx-indicator spin-icon" aria-hidden="true">⟳</span>
            Search
          </button>
        </div>
      </form>
    </main>

    <section class="console">
      <div id="results">
        <h2>Results</h2>
        <p class="empty-hint">Run a search to see results.</p>
      </div>
    </section>
  </div>

  <script>
    document.querySelectorAll('#mode-toggle button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#mode-toggle button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('mode-input').value = btn.dataset.mode;
        document.getElementById('query-input').placeholder =
          btn.dataset.mode === 'keyword' ? 'exact term, e.g. sec(theta)' : 'ask a question in plain language';
      });
    });

    document.getElementById('adv-toggle').addEventListener('click', function () {
      document.getElementById('adv-panel').classList.toggle('open');
    });

    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', function () {
        var current = root.getAttribute('data-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var effectiveDark = current ? current === 'dark' : prefersDark;
        var next = effectiveDark ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('nadir-theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>

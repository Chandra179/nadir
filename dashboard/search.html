{{define "page"}}
<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<script>
  var NADIR_DOC_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8"/><path d="M14 2v6h6M8 13h8M8 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  function nadirAttachedNames() {
    return Array.from(document.querySelectorAll('#composer-attachments [data-chip]'))
      .map(function(el) { return el.dataset.filename; })
      .filter(Boolean);
  }

  function nadirFileCardsRow(names) {
    var row = document.createElement('div');
    row.className = 'flex justify-end flex-wrap gap-2 mb-2';
    names.forEach(function(name) {
      var card = document.createElement('div');
      card.className = 'w-[118px] bg-[#eeece3] border border-[#e3e2d8] rounded-[12px] px-2.5 py-2.5 flex flex-col items-start gap-2';
      var icon = document.createElement('div');
      icon.className = 'w-7 h-7 rounded-[7px] bg-[#dce8fb] text-[#2f5db0] flex items-center justify-center';
      icon.innerHTML = NADIR_DOC_ICON;
      var label = document.createElement('div');
      label.className = 'text-[10.5px] text-[#5c6156] truncate w-full';
      label.textContent = name;
      card.appendChild(icon);
      card.appendChild(label);
      row.appendChild(card);
    });
    return row;
  }

  // htmx:configRequest fires before the request's parameters are locked in,
  // so this is the one hook where we can still add a field — the file
  // picker (POST /ingest) and the search form (POST /retrieval/search) are
  // independent requests, so the currently-attached names have to be
  // threaded through explicitly rather than riding along automatically.
  function nadirConfigRequest(evt) {
    var names = nadirAttachedNames();
    if (names.length) evt.detail.parameters['attached_files'] = names.join(',');
  }

  // Buffered search: the server answers with one complete turn, so there's
  // no real progress to stream. This appends an optimistic placeholder turn
  // (question + attached files + a pulsing "retrieving" row) the instant
  // the request goes out, then removes it once the real turn fragment has
  // been swapped in.
  function nadirBeforeSearch(form) {
    document.getElementById('empty-state')?.remove();
    var input = form.querySelector('#composer-input');
    var query = input ? input.value.trim() : '';
    if (!query) return;

    var attachedNames = nadirAttachedNames();

    // Attachment chips only confirm an import already finished — the file
    // isn't scoped to this message, so clear them once the message is sent
    // (their names were already captured above, and by configRequest).
    var attachments = document.getElementById('composer-attachments');
    if (attachments) attachments.innerHTML = '';

    // htmx has already snapshotted the form's parameters by the time this
    // fires, so clearing the textarea here doesn't affect what gets sent —
    // it just makes the composer feel instant instead of waiting on the
    // (buffered, potentially slow) response before clearing.
    input.value = '';
    input.style.height = 'auto';

    var ri = document.getElementById('reader-inner');
    var wrap = document.createElement('div');
    wrap.id = 'pending-turn';
    wrap.className = 'mb-8';

    if (attachedNames.length) wrap.appendChild(nadirFileCardsRow(attachedNames));

    var userRow = document.createElement('div');
    userRow.className = 'flex justify-end mb-3.5';
    var bubble = document.createElement('div');
    bubble.className = 'text-[14.5px] leading-[1.5] bg-[#2f5d5017] border border-[#2f5d5017] rounded-tl-[14px] rounded-tr-[14px] rounded-bl-[14px] rounded-br-[3px] px-[15px] py-[10px] max-w-[82%]';
    bubble.textContent = query;
    userRow.appendChild(bubble);

    var trace = document.createElement('div');
    trace.className = 'flex gap-2.5 py-1.5';
    var traceIcon = document.createElement('span');
    traceIcon.className = 'w-4 text-center text-[#8b8f81] flex-none animate-pulse';
    traceIcon.textContent = '⊕';
    var traceBody = document.createElement('div');
    traceBody.className = 'flex-1 min-w-0 text-[12.5px]';
    traceBody.innerHTML = '<span class="font-semibold text-[#5c6156]">Tool</span><span class="text-[#8b8f81]"> · </span><span class="text-[#8b8f81] animate-pulse">Retrieving relevant passages…</span>';
    trace.appendChild(traceIcon);
    trace.appendChild(traceBody);

    wrap.appendChild(userRow);
    wrap.appendChild(trace);
    ri.appendChild(wrap);

    var rd = document.getElementById('reader');
    if (rd) rd.scrollTop = rd.scrollHeight;
  }

  function nadirAfterSearch(form) {
    document.getElementById('pending-turn')?.remove();
    form.reset();
    var ta = document.getElementById('composer-input');
    if (ta) ta.style.height = 'auto';
    var rd = document.getElementById('reader');
    if (rd) rd.scrollTop = rd.scrollHeight;
  }
</script>
<style>
  body{ font-family:'Public Sans', ui-sans-serif, system-ui, sans-serif; background:#f7f7f4; color:#20241f; }
  .font-serif-display{ font-family:'Source Serif 4', Georgia, serif; }
  .font-mono-ui{ font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }
  .feedback{ font-size:11px; }
  .feedback-ok{ color:#234840; }
  .feedback-err{ color:#b04a3f; }
  [x-cloak]{ display:none !important; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#e4e1d5; border-radius:6px; border:2px solid #f7f7f4; }
</style>
</head>
<body class="h-full overflow-hidden">
  <div class="flex h-screen relative" x-data="{ sidebarOpen: false, settingsOpen: false }">
    <div x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"
         class="fixed inset-0 bg-black/30 z-30 md:hidden"></div>

    <div x-show="settingsOpen" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4"
         @keydown.escape.window="settingsOpen = false">
      <div @click.outside="settingsOpen = false"
           class="bg-[#f7f7f4] border border-[#dcd8c9] rounded-[16px] shadow-xl w-full max-w-[520px] max-h-[80vh] overflow-y-auto">
        <div id="settings-body">
          <div class="px-5 py-8 text-center text-[12px] text-[#8b8f81]">Loading…</div>
        </div>
      </div>
    </div>

    <div class="fixed inset-y-0 left-0 z-40 w-[264px] max-w-[82vw] transform transition-transform duration-200 ease-out md:static md:translate-x-0 md:flex-none"
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
      {{template "sidebar" .}}
    </div>

    <main class="flex flex-col min-w-0 min-h-0 flex-1"
          x-data="{ ask(text){ this.$refs.composerInput.value = text; htmx.trigger(this.$refs.composerForm, 'submit'); } }">
      <div class="flex items-center gap-2.5 border-b border-[#e3e2d8] px-4 md:px-7 py-3 flex-none">
        <button type="button" @click="sidebarOpen = !sidebarOpen" aria-label="Toggle chats"
          class="md:hidden w-8 h-8 -ml-1 rounded-lg flex items-center justify-center text-[#5c6156] hover:bg-[#eeece3]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="font-serif-display font-semibold text-[15.5px]">New chat</div>
      </div>

      <div id="reader" class="flex-1 overflow-y-auto overflow-x-hidden">
        <div id="reader-inner" class="mx-auto max-w-[768px] px-4 md:px-7 pt-8 pb-4">
          <div id="empty-state" class="pt-16 text-center">
            <div class="font-serif-display text-[22px] font-semibold mb-2">Ask your documents</div>
            <p class="text-[13px] text-[#8b8f81] mb-6">Retrieval runs through Qdrant hybrid search before every generated answer.</p>
            <div class="flex flex-wrap justify-center gap-2">
              <button type="button" @click="ask($el.dataset.q)" class="text-[12.5px] text-[#5c6156] border border-[#dcd8c9] rounded-lg px-3.5 py-2 hover:border-[#2f5d50] hover:text-[#234840] transition" data-q="What's the secant formula, and when do I use it instead of tangent?">What's the secant formula, and when do I use it instead of tangent?</button>
              <button type="button" @click="ask($el.dataset.q)" class="text-[12.5px] text-[#5c6156] border border-[#dcd8c9] rounded-lg px-3.5 py-2 hover:border-[#2f5d50] hover:text-[#234840] transition" data-q="How does chunk overlap affect retrieval quality?">How does chunk overlap affect retrieval quality?</button>
            </div>
          </div>
        </div>
      </div>

      {{template "composer" .}}
    </main>
  </div>
</body>
</html>
{{end}}

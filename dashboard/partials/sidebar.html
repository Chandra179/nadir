{{define "sidebar"}}
<aside class="h-full bg-[#f7f7f4] border-r border-[#e3e2d8] flex flex-col min-h-0">
  <div class="flex items-baseline gap-1.5 px-[18px] pt-[18px] pb-3.5">
    <span class="font-serif-display font-semibold text-[18px]">Nadir</span>
    <span class="text-[12px] text-[#8b8f81]">reading room</span>
  </div>

  <a href="/retrieval" @click="sidebarOpen = false" class="mx-3 mb-3.5 rounded-[9px] border border-[#dcd8c9] bg-white text-[#5c6156] text-[14px] px-3 py-2 flex items-center gap-2 hover:border-[#2f5d50] hover:text-[#234840] transition">+ New chat</a>

  <div class="px-[18px] pb-1.5 text-[11px] tracking-[0.1em] uppercase text-[#8b8f81]">Chats</div>
  <div id="history-sessions" class="px-2 flex flex-col gap-0.5 flex-1 overflow-y-auto min-h-0"
       hx-get="/history/sessions" hx-trigger="load, nadir:turn-appended from:body" hx-swap="innerHTML">
    <div class="px-2.5 py-2 text-[13px] text-[#8b8f81]">Loading…</div>
  </div>

  <div class="mt-auto px-[18px] py-3.5 border-t border-[#e3e2d8] flex items-center gap-2">
    <div class="w-6 h-6 rounded-full bg-[#e4e1d5] border border-[#dcd8c9] flex-none"></div>
    <div class="min-w-0 flex-1">
      <div class="text-[13px] text-[#5c6156]">Local</div>
      <div class="text-[11px] text-[#8b8f81] font-mono-ui truncate">nomic-embed-text</div>
    </div>
  </div>
</aside>
{{end}}

http:
  addr: ":8080"
  read_timeout: 5s
  write_timeout: 35s
  idle_timeout: 120s

middleware:
  timeout: 30s
  logger:
    level: dev  # dev | prod

source:
  paths:
    - "samples"

ingest:
  ignore_patterns:
    - ".gitbook/**"
    - ".git/**"
    - "node_modules/**"
    - "dist/**"
    - ".wrangler/**"
    - "scripts/**"
    - "diagrams/**"
    - ".claude/**"
    - "package.json"
    - "package-lock.json"
    - "*.config.js"
    - "*.jsonc"
    - "build.sh"
    - "CLAUDE.md"

qdrant:
  addr: "localhost:6334"
  collection: "documents_chunks"
  top_k: 5
  prefetch_mul: 5  # store-level candidate multiplier for hybrid search legs

embedder:
  provider: "ollama"
  model: "nomic-embed-text"
  ollama_addr: "http://localhost:11434"
  dimensions: 768

chunker:
  provider: "recursive"  # recursive | sentence-window
  chunk_size: 512
  chunk_overlap: 64
  window_size: 3          # sentences before+after each sentence (sentence-window only)

retry:
  max_attempts: 3
  initial_interval: 500ms
  max_interval: 10s
  multiplier: 2.0

reranker:
  enabled: true       # set true + run: python cmd/reranker/main.py
  addr: "http://localhost:5002"
  candidate_mul: 2     # fetch topK*2 candidates before reranking
  max_concurrent: 10   # max concurrent reranker calls to sidecar

semantic_cache:
  enabled: true     # set true to enable; requires no extra infra (reuses Qdrant)
  collection: "search_cache"
  threshold: 0.90    # cosine similarity cutoff (0.85=permissive, 0.95=strict)
  ttl: 24h           # 0 = no expiry

generator:
  enabled: true      # set true + ensure ollama LLM is pulled; POST /search with {"generate": true}
  ollama_addr: ""     # defaults to embedder.ollama_addr
  model: "gemma3:1b"  # LLM for answer generation; use instruct models
  max_context_tokens: 2800  # token budget for retrieved chunks (~70% of 4k ctx window)
